[workspace]
members = [
    "crates/burgertocow-lib",
    "crates/burgertocow-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# Note: rust-toolchain.toml pins 1.90 for CI because `cross` currently
# requires rustc >= 1.88. The crate itself still builds on 1.85.
license = "MIT"
authors = ["Arthur Debert <debert@gmail.com>"]
repository = "https://github.com/arthur-debert/burgertocow"
homepage = "https://github.com/arthur-debert/burgertocow"
keywords = ["minijinja", "template", "diff", "reverse-template", "jinja"]
categories = ["template-engine", "text-processing", "development-tools"]

[workspace.dependencies]
minijinja = { version = "2.0", features = ["json"] }
similar = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
