name: CI

# Thin caller for the canonical reusable Rust CI workflow at
# arthur-debert/release. Replaces the previously hand-rolled
# rust-setup + nextest + bin/check + release build + artifact
# upload sequence (which already mirrored what rust-ci.yml does —
# this just centralizes it).
#
# See docs/per-stack/rust-ci.md in arthur-debert/release for the
# full input reference. dodot is the reference adopter.
#
# `binary-name: burgertocow` causes the check job to build and
# upload `burgertocow-linux`. The workspace package
# `burgertocow-cli` is renamed to `burgertocow` via `[package] name`
# in its Cargo.toml, so the cargo `-p burgertocow` selector lines
# up with the produced binary file. No bats e2e suite here.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: arthur-debert/release/.github/workflows/rust-ci.yml@v1
    with:
      binary-name: burgertocow
